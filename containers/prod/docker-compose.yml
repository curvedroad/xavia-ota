services:
  xavia-ota:
    build:
      context: ../..
      dockerfile: dockerfile
    ports:
      - '3000:3000'
    environment:
      # Server Configuration
      - HOST=http://localhost:3000

      # Storage Configuration
      - BLOB_STORAGE_TYPE=local

      # Database Configuration
      - DB_TYPE=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=releases_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      # Security
      - PRIVATE_KEY_BASE_64=your_base64_encoded_private_key
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=replace_with_at_least_32_random_bytes
      - GOOGLE_CLIENT_ID=your_google_oauth_client_id
      - GOOGLE_CLIENT_SECRET=your_google_oauth_client_secret
      - GOOGLE_ALLOWED_DOMAIN=curved-road.com
      - GOOGLE_ALLOWED_EMAILS=admin@curved-road.com

    volumes:
      - ./local-releases:/app/local-releases
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=releases_db
    volumes:
      - ../database/schema:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
